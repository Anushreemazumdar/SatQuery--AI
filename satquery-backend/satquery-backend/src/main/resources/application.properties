spring.application.name=satquery-backend
server.port=${SERVER_PORT:8080}

# ---- Database (MySQL 8) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/satquery?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=Anushree#07
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Uploads ----
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:200MB}

# ---- Python AI service ----
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
ai.service.read-timeout-ms=${AI_READ_TIMEOUT_MS:120000}
ai.service.endpoints.vqa=/ai/vqa
ai.service.endpoints.caption=/ai/caption
ai.service.endpoints.grounding=/ai/grounding
ai.service.endpoints.change=/ai/change
ai.service.endpoints.optical-sar=/ai/optical-sar
ai.service.endpoints.health=/health

# ---- Application ----
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.storage.upload-dir=${UPLOAD_DIR:uploads}
# Public URL under which this backend is reachable (used to build image/report URLs the AI service downloads)
app.storage.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
